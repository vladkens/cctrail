[project]
name = "cctrail"
version = "0.2.0"
description = "Report token usage and active time from local Claude Code and Codex history"
readme = "readme.md"
requires-python = ">=3.11"
authors = [{ name = "vladkens" }]
license = { text = "MIT" }
keywords = [
    "analytics",
    "claude-code",
    "codex",
    "cost-tracking",
    "developer-tools",
    "llm",
    "time-tracking",
    "token-usage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["orjson>=3.10.0", "rich>=15.0.0"]

[project.urls]
Homepage = "https://github.com/vladkens/cctrail"
Repository = "https://github.com/vladkens/cctrail"
Issues = "https://github.com/vladkens/cctrail/issues"
Changelog = "https://github.com/vladkens/cctrail/blob/main/changelog.md"

[project.scripts]
cctrail = "cctrail.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "ty>=0.0.1"]

[build-system]
requires = ["hatchling>=1.9.1"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.claude"]

[tool.hatch.build.targets.wheel]
packages = ["cctrail"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.11"
