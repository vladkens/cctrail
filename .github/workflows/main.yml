name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a dev release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  # The shared release steps (github.com/vladkens/actions): `build` runs `make dist` read-only
  # (beside `test`); on main `publish` puts the archives up as the `dev` pre-release, and a
  # `release: vX.Y.Z (#N)` commit creates the tag and the GitHub release with the same archives.
  # `publish` never compiles. Users check an archive with
  # `gh attestation verify FILE -R vladkens/cctrail`.
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest # the macOS binary needs a Mac; Linux and Windows cross-compile
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1
        with:
          dist: make dist
          cache-directories: ~/.cache/cargo-cross

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, build]
    runs-on: ubuntu-latest # no build here, and Linux runners start faster
    permissions:
      attestations: write
      contents: write
      id-token: write # crates.io Trusted Publishing and attestations
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
        with:
          # Until the first version is published by hand and Trusted Publishing is set up for
          # this workflow on crates.io.
          crates: false
